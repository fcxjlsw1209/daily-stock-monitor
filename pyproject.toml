[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-signal-monitor"
version = "0.1.0"
description = "Rule-based daily stock signals and an immutable forward paper-trading ledger"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.3.3",
  "yfinance==1.2.0",
  "exchange-calendars==4.5.6",
]

[project.scripts]
stock-monitor = "stock_signal_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["stock_signal_monitor*"]
